name: CI

# main'e her push'ta ve her PR'da tip kontrolü + testler koşar.
# Bu repo GitHub'a bağlanana kadar bu workflow tetiklenmez; dosya hazır bekler.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # jest.config.js node:sqlite (Node >=22.5) kullanıyor — bkz. src/test/mocks/expo-sqlite.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

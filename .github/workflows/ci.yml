name: CI

# Her push'ta ve her PR'da tip kontrolü + testler koşar.
#
# DAL ADI: bu depoda tek dal `master` (2026-07-23'te github.com/Yusufozdemir3/erek
# olarak bağlandı). Eskiden burada yalnız `main` yazıyordu — depo bağlansa bile
# workflow HİÇ tetiklenmezdi (denetim bulgusu G2: "CI hiç çalışmamış"). İkisi de
# listede: ileride varsayılan dal main'e çevrilirse dosyayı değiştirmek gerekmesin.
on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  typecheck-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # jest.config.js node:sqlite (Node >=22.5) kullanıyor — bkz. src/test/mocks/expo-sqlite.ts
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
